name: Pages

# Jeder Push baut und prüft die Seite. Nur auf main wird sie veröffentlicht (GitHub Pages, Quelle: GitHub Actions).
# Danach prüft ein eigener Schritt die Live-Adresse: Status 200, Manifest, Service Worker, Icons, Schriften und die neue Version.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Bauen und prüfen
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Versionsnummer bestimmen (Datum und Commit)
        id: ver
        run: echo "version=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Nichts Persönliches im Repo (keine Tokens, E-Mail-Adressen, Fotos)
        run: node tools/scan.mjs
      - name: Unit-Tests
        run: node --test "tests/unit/*.test.mjs"
      - name: Seite bauen und Version einsetzen
        run: node tools/build.mjs --version "${{ steps.ver.outputs.version }}" --out _site
      - name: Seite prüfen (Precache-Liste, Manifest, Icons, relative Pfade, keine fremden Hosts)
        run: node tools/check-site.mjs _site --version "${{ steps.ver.outputs.version }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Veröffentlichen
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Live-Adresse prüfen
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Adresse abrufen und prüfen (wartet, bis die neue Version online ist)
        run: node tools/check-site.mjs --url "${{ needs.deploy.outputs.page_url }}" --version "${{ needs.build.outputs.version }}" --retries 30 --delay 6
