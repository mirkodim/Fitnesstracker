name: Probe
# Nur zur Fehlersuche: welche Art von Job bekommt auf GitHub keinen Runner? (Nur auf diesem Test-Zweig.)
on:
  push:
    branches: ['claude/pages-probe']

jobs:
  c1:
    runs-on: ubuntu-latest
    steps:
      - run: echo control
  c2:
    runs-on: ubuntu-latest
    steps:
      - run: echo control
  perm-contents:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo contents
  perm-idtoken:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - run: echo idtoken
  perm-pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
    steps:
      - run: echo pages
  perm-empty:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo empty
  env-a:
    runs-on: ubuntu-latest
    environment: probe-env
    steps:
      - run: echo env
  env-nodeploy:
    runs-on: ubuntu-latest
    environment:
      name: probe-env-nd
      deployment: false
    steps:
      - run: echo env without deployment
  env-b:
    runs-on: ubuntu-latest
    environment: probe-env-b
    steps:
      - run: echo env b
