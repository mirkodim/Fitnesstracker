<title>Trainings-Strichliste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one column for a phone, three areas (Training, Kalender, Essen) switched by a bottom bar.
   Training: sticky header with day switch and progress, one big card for the current exercise with a tally-mark set tracker
   and a single main button, then the day's exercises as a checklist.
   Kalender: month grid with A/B marks and a day detail card. Essen: day totals with a protein bar, entry form, entry list. */
:root {
  --bg: #ECF0F1;
  --surface: #FFFFFF;
  --surface-2: #F3F6F7;
  --ink: #12262B;
  --muted: #506870;
  --line: #CBD6D9;
  --accent: #0B7A85;
  --on-accent: #FFFFFF;
  --accent-soft: #D8EEF0;
  --warm: #9A5800;
  --warm-soft: #FBEBD2;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1A1D;
    --surface: #15262A;
    --surface-2: #1B3035;
    --ink: #E7F0F1;
    --muted: #93AAB0;
    --line: #2A4046;
    --accent: #43C3CE;
    --on-accent: #052A2E;
    --accent-soft: #1A3C41;
    --warm: #F2B24A;
    --warm-soft: #38290F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1A1D;
  --surface: #15262A;
  --surface-2: #1B3035;
  --ink: #E7F0F1;
  --muted: #93AAB0;
  --line: #2A4046;
  --accent: #43C3CE;
  --on-accent: #052A2E;
  --accent-soft: #1A3C41;
  --warm: #F2B24A;
  --warm-soft: #38290F;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-appearance: none; appearance: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { max-width: 560px; margin-inline: auto; padding-inline: 16px; padding-block: 0 calc(104px + env(safe-area-inset-bottom, 0px)); }
main { display: flex; flex-direction: column; gap: 22px; margin-top: 14px; }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--bg);
  margin-inline: -16px; padding-inline: 16px; padding-block: 12px 10px;
  box-shadow: 0 1px 0 var(--line);
}
.days { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.day {
  display: flex; flex-direction: column; gap: 2px; text-align: left; cursor: pointer;
  min-height: 64px; padding: 10px 12px; min-width: 0;
  background: var(--surface); border: 2px solid var(--line); border-radius: 14px;
}
.day b { font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1; letter-spacing: .01em; }
.day span { font-size: 14px; line-height: 1.25; color: var(--muted); }
.day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.day[aria-pressed="true"] span { color: inherit; opacity: .92; }
.prog { display: flex; justify-content: space-between; gap: 12px; margin: 12px 0 0; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s; }

/* month / day navigation */
.mnav { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center; gap: 8px; }
.mt { margin: 0; text-align: center; font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1; }
.mt-wrap { text-align: center; min-width: 0; }
.mt-wrap .sub { font-size: 14px; color: var(--muted); margin-top: 2px; }
.icon { width: 48px; height: 48px; display: grid; place-items: center; cursor: pointer; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); padding: 0; }
.icon:disabled { opacity: .35; cursor: default; }

/* cards */
.card {
  display: flex; flex-direction: column; gap: 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px;
}
.eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.name {
  margin: 6px 0 0; font-family: var(--font-display); font-weight: 700; line-height: 1;
  font-size: clamp(32px, 9vw, 40px); letter-spacing: .005em; text-wrap: balance; overflow-wrap: anywhere;
}
.gear { margin-top: 6px; font-size: 15px; color: var(--muted); }
.rx { display: flex; align-items: baseline; gap: 8px; margin: 0; flex-wrap: wrap; }
.rx b { font-family: var(--font-display); font-size: 34px; font-weight: 600; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.rx span { font-size: 16px; color: var(--muted); }

/* tally */
.tally { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 10px; }
.set {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  height: 96px; padding: 0; min-width: 0; cursor: pointer;
  background: var(--surface-2); border: 2px solid var(--line); border-radius: 14px;
  color: var(--muted); font-size: 14px;
}
.set svg { width: 28px; height: 52px; }
.set .stroke { fill: none; stroke: var(--line); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 50; stroke-dashoffset: 0; }
.set[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.set[aria-pressed="true"] .stroke { stroke: var(--accent); }
.set.fresh[aria-pressed="true"] .stroke { animation: draw .3s ease-out; }
@keyframes draw { from { stroke-dashoffset: 50; } to { stroke-dashoffset: 0; } }

/* buttons */
.btn {
  width: 100%; min-height: 64px; padding: 10px 14px; cursor: pointer; border: 0; border-radius: 16px;
  background: var(--accent); color: var(--on-accent);
  font-family: var(--font-display); font-weight: 600; font-size: 26px; line-height: 1.1; letter-spacing: .01em;
}
.btn.ghost { background: transparent; border: 2px solid var(--line); color: var(--ink); }
.btn.sm { min-height: 52px; font-size: 21px; padding: 8px 10px; }
.btn:active { transform: scale(.99); }
.btn:disabled { opacity: .5; cursor: default; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two > * { min-width: 0; }
.two > :only-child { grid-column: 1 / -1; }
.chip {
  min-height: 48px; cursor: pointer; border-radius: 12px; border: 2px solid var(--line);
  background: var(--surface-2); font-family: var(--font-display); font-size: 21px; font-weight: 600; padding: 0 8px;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.link { background: none; border: 0; padding: 12px 0; min-height: 48px; text-align: left; cursor: pointer; color: var(--muted); font-size: 15px; text-decoration: underline; }
.link.inline { padding: 0; min-height: 0; display: inline; }

/* details */
.cues { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.cues li { position: relative; padding-left: 20px; }
.cues li::before { content: ""; position: absolute; left: 2px; top: .6em; width: 7px; height: 7px; border-radius: 2px; background: var(--accent); }
.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 14px; border-top: 1px solid var(--line); }
.field label { font-weight: 500; }
.field input {
  width: 112px; padding: 10px 12px; font: inherit; font-size: 20px; text-align: right;
  background: var(--surface-2); color: var(--ink); border: 2px solid var(--line); border-radius: 12px;
  font-variant-numeric: tabular-nums;
}
.note { padding: 12px 14px; border-radius: 12px; background: var(--surface-2); font-size: 15px; color: var(--muted); }
.note b { color: var(--ink); font-weight: 600; }
.msg { margin: 0; min-height: 1.4em; font-size: 15px; color: var(--muted); }
.hint { margin: 0; font-size: 14px; color: var(--muted); }
.empty { margin: 0; color: var(--muted); }

/* rest */
.card.rest { background: var(--warm-soft); border-color: transparent; }
.card.rest .eyebrow { color: var(--warm); }
.clock { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 88px; line-height: 1; color: var(--warm); font-variant-numeric: tabular-nums; }
.bar.warm { background: var(--line); background: color-mix(in srgb, var(--warm) 22%, transparent); margin-top: 0; }
.bar.warm > i { background: var(--warm); transition: width .25s linear; }
.next b { font-family: var(--font-display); font-size: 28px; font-weight: 600; line-height: 1.1; display: block; margin-top: 4px; }
.next span { color: var(--muted); }

/* plank ring */
.ring { position: relative; width: min(240px, 70vw); aspect-ratio: 1; margin-inline: auto; max-width: 100%; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .trk { fill: none; stroke: var(--line); stroke-width: 12; }
.ring .prg { fill: none; stroke: var(--accent); stroke-width: 12; stroke-linecap: round; stroke-dasharray: 553; transition: stroke-dashoffset .25s linear; }
.ring-in { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 4px; }
.ring-in .clock { font-size: 76px; color: var(--ink); }

/* list */
.list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.row {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 12px 14px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
}
button.row { cursor: pointer; }
.row.current { background: var(--accent-soft); border-color: var(--accent); }
.row .check { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); }
.row.done .check { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.rn { flex: 1; min-width: 0; line-height: 1.2; }
.rn b { display: block; font-weight: 500; overflow-wrap: anywhere; }
.rn small { display: block; margin-top: 2px; font-size: 14px; color: var(--muted); }
.row.done .rn b { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 2px; }
.pips { flex: none; display: flex; gap: 5px; }
.pip { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.pip.on { background: var(--accent); }

/* exercise demo */
.demo { display: flex; flex-direction: column; gap: 14px; }
.demo-body { display: flex; flex-direction: column; gap: 14px; }
.stage { display: flex; flex-direction: column; width: 100%; padding: 0; border: 0; border-radius: 14px; background: var(--surface-2); cursor: pointer; overflow: hidden; }
.stage svg { display: block; width: 100%; height: auto; }
.stage .badge { align-self: stretch; margin: 0 10px 10px; padding: 10px 14px; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-size: 16px; font-weight: 600; text-align: center; }
.cap { margin: 0; min-height: 3em; font-size: 16px; font-weight: 500; }
.cap.bad { color: var(--warm); }
.legend { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.legend i { width: 22px; height: 7px; border-radius: 4px; background: var(--accent); flex: none; }
.demo h4 { margin: 4px 0 0; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.demo ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.demo li { position: relative; padding-left: 20px; }
.demo li::before { content: ""; position: absolute; left: 2px; top: .6em; width: 7px; height: 7px; border-radius: 2px; background: var(--accent); }
.demo ul.bad li::before { background: var(--warm); }
.demo p.feel { margin: 0; }
.fl { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.sg { stroke: var(--ink); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.sg.hl { stroke: var(--accent); }
.sg.bad { stroke: var(--warm); }
.sg.far { stroke: var(--ink); opacity: .38; }
.hd { fill: var(--surface-2); stroke: var(--ink); stroke-width: 3.5; }
.hd.bad { stroke: var(--warm); }
.pp { fill: var(--line); stroke: var(--muted); stroke-width: 2; }
.pl { fill: var(--surface-2); stroke-width: 3; }
.pd { fill: var(--muted); }
.an { stroke: var(--muted); stroke-width: 5; stroke-linecap: round; }
.st { stroke: var(--muted); stroke-width: 2.5; fill: none; }
.st.bd { stroke-dasharray: 5 3; }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wd { text-align: center; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-block: 4px; }
.cd {
  min-height: 56px; min-width: 0; padding: 6px 0 4px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px;
  border-radius: 12px; border: 2px solid transparent; background: var(--surface-2);
}
.cd b { font-weight: 500; font-size: 16px; font-variant-numeric: tabular-nums; }
.cd.today { border-color: var(--accent); }
.cd.sel { background: var(--accent-soft); }
.cd.empty { background: none; border: 0; pointer-events: none; }
.tags { display: flex; gap: 3px; min-height: 16px; }
.tg { display: inline-grid; place-items: center; min-width: 16px; height: 16px; padding-inline: 2px; border-radius: 5px; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 700; font-style: normal; }
.tg.big { min-width: 40px; height: 40px; border-radius: 10px; font-size: 20px; font-family: var(--font-display); }
.erow { display: flex; align-items: center; gap: 12px; }
.erow .grow { flex: 1; min-width: 0; line-height: 1.2; }
.erow .grow b { display: block; font-weight: 600; }
.erow .grow small { color: var(--muted); font-size: 14px; }
.calform { display: flex; flex-direction: column; gap: 12px; }
.calform input[type="date"] { width: 100%; padding: 12px 14px; font: inherit; font-size: 18px; background: var(--surface-2); color: var(--ink); border: 2px solid var(--line); border-radius: 12px; }

/* food */
.fcol { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fcol label { font-size: 15px; font-weight: 500; }
.fcol input, .bk textarea {
  width: 100%; min-width: 0; padding: 12px 14px; font: inherit; font-size: 18px;
  background: var(--surface-2); color: var(--ink); border: 2px solid var(--line); border-radius: 12px;
}
.bk textarea { font-size: 15px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: end; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.preview { margin: 0; min-height: 1.5em; font-size: 16px; color: var(--accent); font-weight: 500; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; }
.tile { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.tile b { display: block; font-family: var(--font-display); font-size: 30px; line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile span { font-size: 14px; color: var(--muted); }
.tile b i { font-style: normal; font-size: 17px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.prot { display: flex; flex-direction: column; gap: 8px; }
.prot-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.prot-num { margin: 0; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.prot-num b { font-family: var(--font-display); font-size: 56px; line-height: 1; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.prot-num span { color: var(--muted); font-size: 18px; }
.prot .bar { height: 12px; margin-top: 0; }
.prot-sub { margin: 0; font-size: 15px; color: var(--muted); }
.goal { display: flex; flex-direction: column; gap: 12px; padding-top: 14px; border-top: 1px solid var(--line); }
.fe { display: flex; flex-direction: column; gap: 8px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.fe-top { display: flex; align-items: flex-start; gap: 10px; }
.fe-name { flex: 1; min-width: 0; line-height: 1.2; }
.fe-name b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.fe-name small { color: var(--muted); font-size: 14px; }
.fe-del { flex: none; width: 44px; height: 44px; margin: -6px -6px 0 0; display: grid; place-items: center; cursor: pointer; background: none; border: 0; border-radius: 12px; color: var(--muted); padding: 0; }
.nchips { display: flex; flex-wrap: wrap; gap: 6px; }
.nchip { display: inline-flex; gap: 4px; align-items: baseline; padding: 4px 10px; border-radius: 99px; background: var(--surface-2); font-size: 15px; white-space: nowrap; }
.nchip b { font-family: var(--font-display); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.fe-src { margin: 0; font-size: 13px; color: var(--muted); }
.chiprow { display: flex; flex-wrap: wrap; gap: 8px; }
.rc { min-height: 44px; padding: 0 14px; cursor: pointer; border-radius: 99px; border: 2px solid var(--line); background: var(--surface-2); font-size: 16px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* footer, backup */
.foot { display: flex; flex-direction: column; gap: 4px; margin-top: 26px; font-size: 14px; color: var(--muted); }
.foot p { margin: 0; }
.confirm { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; color: var(--ink); font-size: 16px; }
.bk { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }

/* bottom navigation */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { max-width: 560px; margin-inline: auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.nav button { min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 500; cursor: pointer; padding: 0; }
.nav button[aria-current="page"] { color: var(--accent); font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>

  function startPlank(ex) {

    R.plank = { ex: ex, secs: S.plankSecs, holdAt: now + READY * 1000, endAt: now + (READY + S.plankSecs) * 1000, phase: 'ready' };
    render();
  }

  function plankState() {
    var p = R.plank, now = Date.now();
    if (now < p.holdAt) return { phase: 'ready', left: Math.ceil((p.holdAt - now) / 1000), frac: 1 };
    return { phase: 'hold', left: Math.max(0, Math.ceil((p.endAt - now) / 1000)), frac: Math.max(0, (p.endAt - now) / 1000 / p.secs) };
  }

  function resetDay(d) {
    S.sets[d] = {}; S.stamp[d] = ''; S.logged[d] = ''; R.pick[d] = null; R.rest = null; R.plank = null; R.confirm = false; R.last = null; R.calForm = false;
    save(); render(); toTop();
  }

  function calSave() {
    var inp = document.getElementById('cal-date'), msg = document.getElementById('cal-msg'), v = inp ? inp.value : '';
    var d = parseKey(v);
    if (!d || v > todayKey()) { if (msg) msg.textContent = 'Bitte ein Datum bis heute wählen.'; return; }
    var arr = S.log[v] || (S.log[v] = []);
    if (arr.indexOf(S.day) < 0) arr.push(S.day);
    arr.sort();
    S.logged[S.day] = v;
    R.calForm = false; R.calSel = v; R.cal = { y: d.getFullYear(), m: d.getMonth() };
    save(); render();
  }

  function addFood() {
    var e = draftEntry();
    if (!e.name && e.g == null && !Object.keys(e.v).length) { R.foodMsg = 'Trage mindestens etwas ein. Alle Felder sind freiwillig.'; setMsg('food-msg', R.foodMsg); return; }
    e.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    var k = R.foodDate;
    (S.food[k] = S.food[k] || []).push(e);
    if (e.name) {
      S.recent = S.recent.filter(function (x) { return x.name.toLowerCase() !== e.name.toLowerCase(); });
      S.recent.unshift({ id: e.id, name: e.name, g: e.g, mode: e.mode, v: e.v });
      S.recent = S.recent.slice(0, 8);
    }
    R.undo = null;
    R.draft = newDraft(R.draft.mode);
    R.foodMsg = 'Eingetragen.';
    save(); render();
  }

  function setMsg(id, text) { var el = document.getElementById(id); if (el) el.textContent = text; }

  function exportText() { return JSON.stringify(S); }

  /* ---------- views: training ---------- */
  function navHTML() {
    var items = [['train', 'Training'], ['cal', 'Kalender'], ['food', 'Essen']];
    return '<nav class="nav" aria-label="Bereiche"><div class="nav-in">' + items.map(function (it) {
      return '<button type="button" data-act="tab" data-tab="' + it[0] + '"' + (R.tab === it[0] ? ' aria-current="page"' : '') + '>' + ICONS[it[0]] + '<span>' + it[1] + '</span></button>';
    }).join('') + '</div></nav>';
  }

  function headerHTML(t) {
    var days = ['A', 'B'].map(function (k) {
      var tt = totals(k), done = tt.done >= tt.total;
      return '<button class="day" type="button" data-act="day" data-day="' + k + '" aria-pressed="' + (k === S.day) + '">' +
        '<b>' + PLAN[k].label + '</b><span>' + PLAN[k].focus + (done ? ' · erledigt' : '') + '</span></button>';
    }).join('');
    var pct = Math.round(t.done / t.total * 100);
    return '<header class="top"><div class="days">' + days + '</div>' +
      '<div class="prog"><span>' + t.done + ' von ' + t.total + ' Sätzen</span><span>' + t.exDone + ' von ' + t.exTotal + ' Übungen</span></div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div></header>';
  }

  function tallyHTML(ex, done) {
    var out = '';
    for (var i = 0; i < ex.sets; i++) {
      var on = i < done, fresh = R.fresh === ex.id + ':' + i;
      out += '<button type="button" class="set' + (fresh ? ' fresh' : '') + '" data-act="set" data-i="' + i + '" aria-pressed="' + on + '" aria-label="Satz ' + (i + 1) + (on ? ' zurücknehmen' : ' abhaken') + '">' +
        '<svg viewBox="0 0 28 52" aria-hidden="true"><path class="stroke" d="M14 5V47"/></svg><span>Satz ' + (i + 1) + '</span></button>';
    }
    return '<div class="tally" style="--n:' + ex.sets + '">' + out + '</div>';
  }

  function plankRunHTML() {
    var ps = plankState(), off = Math.round(553 * (1 - ps.frac));
    return '<div class="ring"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="trk" cx="100" cy="100" r="88"/><circle class="prg" id="plank-ring" cx="100" cy="100" r="88" style="stroke-dashoffset:' + off + '"/></svg>' +
      '<div class="ring-in"><div class="clock" id="plank-time">' + ps.left + '</div><div class="eyebrow" id="plank-label">' + (ps.phase === 'ready' ? 'Position einnehmen' : 'Halten') + '</div></div></div>' +
      '<button class="btn ghost" type="button" data-act="plank-cancel">Abbrechen</button>';
  }

  function demoHTML(ex) {
    var tips = TIPS[ex.id];
    var html = '<div class="demo"><button class="btn ghost sm" type="button" data-act="demo-toggle" aria-expanded="' + R.demoOpen + '">' + (R.demoOpen ? 'Hinweise schließen' : 'So geht die Übung') + '</button>';
    if (R.demoOpen && tips) {
      html += '<div class="demo-body">' +
        '<button type="button" class="stage" data-act="anim-play" data-ex="' + ex.id + '" aria-label="Bewegung abspielen"><svg viewBox="0 0 320 190" role="img" aria-label="Strichfigur zeigt die Bewegung"><g id="fig-g" data-ex="' + ex.id + '"></g></svg><span class="badge" id="fig-badge">Abspielen</span></button>' +
        '<p class="cap" id="fig-cap"></p>' +
        '<p class="legend"><i></i><span>Farbig: hier arbeitet der Muskel. Orange: so nicht.</span></p>' +
        '<h4>Darauf achten</h4><ul>' + tips.watch.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>' +
        '<h4>Häufige Fehler</h4><ul class="bad">' + tips.mistakes.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>' +
        '<h4>Hier spürst du es</h4><p class="feel">' + tips.feel + '</p></div>';
    }
    return html + '</div>';
  }

  function focusHTML(d, ex, t) {
    var done = doneSets(d, ex.id), idx = t.exDone + 1;
    var html = '<section class="card"><div><p class="eyebrow">Jetzt dran · Übung ' + Math.min(idx, t.exTotal) + ' von ' + t.exTotal + '</p>' +
      '<h2 class="name">' + ex.name + '</h2>' + (ex.gear ? '<div class="gear">' + ex.gear + '</div>' : '') + '</div>' +
      '<p class="rx"><b>' + rxText(ex) + '</b><span>' + unitText(ex) + '</span></p>';

    if (R.plank && R.plank.ex.id === ex.id) {
      html += plankRunHTML();
    } else {
      html += tallyHTML(ex, done);
      if (ex.timer) {
        html += '<div class="chips" role="group" aria-label="Haltezeit">' +
          [45, 60].map(function (s) { return '<button class="chip" type="button" data-act="plank-secs" data-secs="' + s + '" aria-pressed="' + (S.plankSecs === s) + '">' + s + ' s</button>'; }).join('') + '</div>';
        html += '<button class="btn" type="button" data-act="plank-start">Plank starten</button>';
      } else {
        html += '<button class="btn" type="button" data-act="done">Satz ' + (done + 1) + ' geschafft</button>';
      }
      html += demoHTML(ex);
      html += '<ul class="cues">' + ex.cues.map(function (c) { return '<li>' + c + '</li>'; }).join('') + '</ul>';
      if (ex.weight) {
        html += '<div class="field"><label for="w-' + ex.id + '">Gewicht (kg)</label>' +
          '<input id="w-' + ex.id + '" data-weight="' + ex.id + '" type="text" inputmode="decimal" autocomplete="off" placeholder="–" value="' + esc(S.weights[ex.id] || '') + '"></div>';
      }
      if (ex.knee) html += '<div class="note">' + KNEE_NOTE + '</div>';
    }
    return html + '</section>';
  }

  function restHTML(d) {
    var r = R.rest, cur = currentEx(d), now = Date.now();
    var left = Math.max(0, Math.ceil((r.endAt - now) / 1000));
    var title = left === 0 ? 'Pause vorbei' : (r.afterExercise ? 'Übung geschafft · Pause' : 'Pause');
    var top, sub;
    if (r.afterExercise) { top = cur.name; sub = rxText(cur) + ' ' + unitText(cur); }
    else { top = 'Satz ' + (doneSets(d, cur.id) + 1) + ' von ' + cur.sets; sub = cur.name; }
    var pct = Math.max(0, Math.min(100, left / r.total * 100));
    return '<section class="card rest"><p class="eyebrow" id="rest-title">' + title + '</p>' +
      '<p class="clock" id="rest-clock">' + clock(left) + '</p>' +
      '<div class="bar warm"><i id="rest-bar" style="width:' + pct + '%"></i></div>' +
      '<div class="next"><p class="eyebrow">Als Nächstes</p><b>' + top + '</b><span>' + sub + '</span></div>' +
      '<button class="btn" type="button" data-act="skip">Weiter</button>' +
      '<div class="two"><button class="btn ghost sm" type="button" data-act="plus">+ 30 s</button>' +
      (R.last ? '<button class="btn ghost sm" type="button" data-act="undo">Rückgängig</button>' : '<span></span>') + '</div>' +
      demoHTML(cur) + '</section>';
  }

  function logBlockHTML(d) {
    var t = todayKey();
    if (R.calForm) {
      return '<div class="calform"><label for="cal-date">An welchem Tag hast du trainiert?</label>' +
        '<input id="cal-date" type="date" value="' + t + '" max="' + t + '">' +
        '<div class="two"><button class="btn sm" type="button" data-act="cal-save">Eintragen</button><button class="btn ghost sm" type="button" data-act="cal-cancel">Abbrechen</button></div>' +
        '<p class="msg" id="cal-msg"></p></div>';
    }
    if (S.logged[d]) {
      return '<div class="note"><b>Eingetragen:</b> ' + PLAN[d].label + ' am ' + longDate(S.logged[d]) + '.</div>' +
        '<button class="btn" type="button" data-act="tab" data-tab="cal" data-key="' + S.logged[d] + '">Kalender ansehen</button>';
    }
    return '<button class="btn" type="button" data-act="cal-open">Training in Kalender eintragen</button>';
  }

  function finishHTML(d, t) {
    var other = d === 'A' ? 'B' : 'A', ot = totals(other), otherOpen = ot.done < ot.total;
    return '<section class="card"><div><p class="eyebrow">' + PLAN[d].label + ' · ' + PLAN[d].focus + '</p><h2 class="name">Fertig für heute</h2></div>' +
      '<p class="rx"><b>' + t.done + ' von ' + t.total + '</b><span>Sätzen erledigt</span></p>' +
      logBlockHTML(d) +
      '<div class="note"><b>Knie-Check:</b> Ist das Knie morgen geschwollen oder steif, beim nächsten Mal bei den Beinübungen weniger Sätze oder Gewicht.</div>' +
      (otherOpen ? '<button class="btn ghost" type="button" data-act="day" data-day="' + other + '">' + PLAN[other].label + ' ansehen</button>' : '') +
      '<button class="btn ghost" type="button" data-act="restart">Neu starten</button></section>';
  }

  function listHTML(d, cur) {
    var rows = exs(d).map(function (ex) {
      var n = doneSets(d, ex.id), done = n >= ex.sets, isCur = cur && cur.id === ex.id, pips = '';
      for (var i = 0; i < ex.sets; i++) pips += '<i class="pip' + (i < n ? ' on' : '') + '"></i>';
      var inner = '<span class="check">' + (done ? CHECK : '') + '</span>' +
        '<span class="rn"><b>' + ex.name + '</b><small>' + rxText(ex) + ' ' + unitText(ex) + '</small></span>' +
        '<span class="pips" aria-hidden="true">' + pips + '</span>';
      if (done) return '<div class="row done">' + inner + '</div>';
      return '<button type="button" class="row' + (isCur ? ' current' : '') + '" data-act="pick" data-id="' + ex.id + '"' + (isCur ? ' aria-current="true"' : '') + '>' + inner + '</button>';
    }).join('');
    return '<section aria-labelledby="plan-h"><h3 class="eyebrow" id="plan-h">Heute im Plan</h3><div class="list">' + rows + '</div></section>';
  }

  /* ---------- views: calendar ---------- */
  function monthCounts() {
    var pre = R.cal.y + '-' + pad(R.cal.m + 1) + '-', a = 0, b = 0;
    Object.keys(S.log).forEach(function (k) {
      if (k.indexOf(pre) !== 0) return;
      if (S.log[k].indexOf('A') >= 0) a++;
      if (S.log[k].indexOf('B') >= 0) b++;
    });
    return { a: a, b: b, n: a + b };
  }

  function calHeaderHTML() {
    var c = monthCounts();
    return '<header class="top"><div class="mnav">' +
      '<button class="icon" type="button" data-act="cal-prev" aria-label="Vorheriger Monat">' + CHEV_L + '</button>' +
      '<h2 class="mt">' + MON[R.cal.m] + ' ' + R.cal.y + '</h2>' +
      '<button class="icon" type="button" data-act="cal-next" aria-label="Nächster Monat">' + CHEV_R + '</button></div>' +
      '<p class="prog"><span>' + (c.n === 1 ? '1 Training' : c.n + ' Trainings') + ' in diesem Monat</span><span>Tag A: ' + c.a + ' · Tag B: ' + c.b + '</span></p></header>';
  }

  function calGridHTML() {
    var y = R.cal.y, m = R.cal.m, lead = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate(), t = todayKey(), i;
    var out = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(function (w) { return '<span class="wd">' + w + '</span>'; }).join('');
    for (i = 0; i < lead; i++) out += '<span class="cd empty"></span>';
    for (i = 1; i <= days; i++) {
      var key = y + '-' + pad(m + 1) + '-' + pad(i), tr = S.log[key] || [];
      var tags = tr.map(function (l) { return '<i class="tg">' + l + '</i>'; }).join('');
      out += '<button type="button" class="cd' + (key === t ? ' today' : '') + (key === R.calSel ? ' sel' : '') + '" data-act="cal-day" data-key="' + key + '" aria-pressed="' + (key === R.calSel) + '" aria-label="' + longDate(key) + (tr.length ? ', Training ' + tr.join(' und ') : '') + '">' +
        '<b>' + i + '</b><span class="tags">' + tags + '</span></button>';
    }
    return '<section class="card" aria-label="Monatsübersicht"><div class="cal">' + out + '</div></section>';
  }

  function calDetailHTML() {
    var k = R.calSel, tr = S.log[k] || [], future = k > todayKey(), h = '<section class="card"><div><p class="eyebrow">Ausgewählter Tag</p><h3 class="name" style="font-size:28px">' + longDate(k) + '</h3></div>';
    if (tr.length) {
      h += tr.map(function (l) {
        return '<div class="erow"><span class="tg big">' + l + '</span><span class="grow"><b>' + PLAN[l].label + '</b><small>' + PLAN[l].focus + '</small></span>' +
          '<button class="link" type="button" data-act="cal-remove" data-day="' + l + '">Entfernen</button></div>';
      }).join('');
    } else {
      h += '<p class="empty">' + (future ? 'Dieser Tag liegt in der Zukunft.' : 'An diesem Tag ist kein Training eingetragen.') + '</p>';
    }
    if (!future) {
      var missing = ['A', 'B'].filter(function (l) { return tr.indexOf(l) < 0; });
      if (missing.length) {
        h += '<div class="two">' + missing.map(function (l) { return '<button class="btn ghost sm" type="button" data-act="cal-add" data-day="' + l + '">' + PLAN[l].label + ' eintragen</button>'; }).join('') + '</div>';
      }
    }
    var T = dayTotals(k);
    if (T.n) {
      var parts = [];
      if (T.has.kcal) parts.push(fmt(T.sum.kcal, 'kcal') + ' kcal');
      if (T.has.p) parts.push(fmt(T.sum.p, 'g') + ' g Protein');
      h += '<div class="note"><b>Essen:</b> ' + (parts.length ? parts.join(' · ') + ' · ' : '') + T.n + (T.n === 1 ? ' Eintrag' : ' Einträge') + '</div>' +
        '<button class="btn ghost sm" type="button" data-act="tab" data-tab="food" data-key="' + k + '">Essen ansehen</button>';
    }
    return h + '</section>';
  }

  /* ---------- views: food ---------- */
  function proteinBar(T) {
    if (S.goalP) {
      var got = T.sum.p || 0, pct = Math.min(100, Math.round(got / S.goalP * 100));
      return '<p class="prog"><span>Protein</span><span>' + fmt(got, 'g') + ' von ' + fmt(S.goalP, 'g') + ' g</span></p><div class="bar"><i style="width:' + pct + '%"></i></div>';
    }
    if (T.has.p) return '<p class="prog"><span>Protein</span><span>' + fmt(T.sum.p, 'g') + ' g</span></p>';
    return '';
  }

  function foodHeaderHTML() {
    var k = R.foodDate, isToday = k === todayKey(), T = dayTotals(k);
    return '<header class="top"><div class="mnav">' +
      '<button class="icon" type="button" data-act="food-prev" aria-label="Vorheriger Tag">' + CHEV_L + '</button>' +
      '<div class="mt-wrap"><h2 class="mt">' + (isToday ? 'Heute' : WDL[parseKey(k).getDay()]) + '</h2><div class="sub">' + longDate(k) + '</div></div>' +
      '<button class="icon" type="button" data-act="food-next" aria-label="Nächster Tag"' + (isToday ? ' disabled' : '') + '>' + CHEV_R + '</button></div>' +
      proteinBar(T) + '</header>';
  }

  function goalHintText() {
    var w = S.weightKg;
    if (w) return 'Richtwert beim Krafttraining: etwa 1,4 bis 2,0 g pro kg Körpergewicht. Bei ' + fmt(w, 'g') + ' kg sind das ' + Math.round(1.4 * w) + ' bis ' + Math.round(2 * w) + ' g am Tag. Das ist eine Orientierung, keine persönliche Empfehlung.';
    return 'Richtwert beim Krafttraining: etwa 1,4 bis 2,0 g pro kg Körpergewicht. Trage dein Gewicht ein, dann rechne ich es aus. Das ist eine Orientierung, keine persönliche Empfehlung.';
  }
  function goalBtnHTML() {
    var w = S.weightKg;
    return w ? '<button class="btn ghost sm" type="button" data-act="goal-w16">1,6 g pro kg übernehmen (' + Math.round(1.6 * w) + ' g)</button>' : '';
  }
  function goalHTML() {
    var w = S.weightKg, hint = goalHintText();
    return '<div class="goal">' +
      '<div class="fcol"><label for="goal-p">Protein-Ziel pro Tag (g)</label><input id="goal-p" data-goal="p" type="text" inputmode="decimal" autocomplete="off" placeholder="z. B. 100" value="' + (S.goalP ? esc(numStr(S.goalP)) : '') + '"></div>' +
      '<div class="fcol"><label for="goal-w">Körpergewicht (kg), nur für den Richtwert</label><input id="goal-w" data-goal="w" type="text" inputmode="decimal" autocomplete="off" placeholder="z. B. 60" value="' + (w ? esc(numStr(w)) : '') + '"></div>' +
      '<p class="hint" id="goal-hint">' + hint + '</p>' +
      '<div id="goal-btn">' + goalBtnHTML() + '</div>' +
      '</div>';
  }

  function summaryHTML(T) {
    var h = '<section class="card"><h3 class="eyebrow">Tagesbilanz</h3>';
    if (!T.n) h += '<p class="empty">Noch nichts eingetragen. Trage unten ein, was du gegessen hast.</p>';
    if (S.goalP || T.has.p) {
      var got = T.sum.p || 0;
      h += '<div class="prot"><div class="prot-top"><span class="eyebrow">Protein</span>' + (S.goalP ? '<span class="hint">Ziel ' + fmt(S.goalP, 'g') + ' g</span>' : '') + '</div>';
      if (S.goalP) {
        var pct = Math.min(100, Math.round(got / S.goalP * 100)), left = S.goalP - got;
        h += '<p class="prot-num"><b>' + fmt(got, 'g') + '</b><span>von ' + fmt(S.goalP, 'g') + ' g</span></p><div class="bar"><i style="width:' + pct + '%"></i></div>' +
          '<p class="prot-sub">' + (left > 0 ? 'Noch ' + fmt(left, 'g') + ' g bis zum Ziel' : 'Ziel erreicht') + '</p>';
      } else {
        h += '<p class="prot-num"><b>' + fmt(got, 'g') + '</b><span>g Protein</span></p>';
      }
      h += '</div>';
    }
    var tiles = '';
    NUTR.forEach(function (n) {
      if (n.k === 'p' || !T.has[n.k]) return;
      tiles += '<div class="tile"><b>' + fmt(T.sum[n.k], n.u) + '<i>' + n.u + '</i></b><span>' + n.l + '</span></div>';
    });
    if (tiles) h += '<div class="tiles">' + tiles + '</div>';
    if (T.skipped) h += '<p class="hint">' + (T.skipped === 1 ? '1 Eintrag hat keine Menge und ist nicht eingerechnet.' : T.skipped + ' Einträge haben keine Menge und sind nicht eingerechnet.') + '</p>';
    h += '<button class="link" type="button" data-act="goal-toggle">' + (R.goalOpen ? 'Protein-Ziel schließen' : (S.goalP ? 'Protein-Ziel ändern' : 'Protein-Ziel festlegen')) + '</button>';
    if (R.goalOpen) h += goalHTML();
    return h + '</section>';
  }

  function fieldHTML(n, d) {
    return '<div class="fcol"><label for="f-' + n.k + '">' + n.l + ' (' + n.u + ')</label><input id="f-' + n.k + '" data-draft-v="' + n.k + '" type="text" inputmode="decimal" autocomplete="off" value="' + esc(d.v[n.k]) + '"></div>';
  }

  function formHTML() {
    var d = R.draft, h = '<section class="card" aria-labelledby="fh"><h3 class="eyebrow" id="fh">Essen eintragen</h3>';
    if (S.recent.length) {
      h += '<div class="chiprow" role="group" aria-label="Zuletzt gegessen">' + S.recent.map(function (e, i) {
        return '<button class="rc" type="button" data-act="food-recent" data-i="' + i + '">' + esc(e.name) + '</button>';
      }).join('') + '</div>';
    }
    h += '<div class="fcol"><label for="f-name">Was hast du gegessen?</label><input id="f-name" data-draft="name" type="text" autocomplete="off" placeholder="z. B. Magerquark" value="' + esc(d.name) + '"></div>' +
      '<div class="fcol"><label for="f-g">Menge in Gramm</label><input id="f-g" data-draft="g" type="text" inputmode="decimal" autocomplete="off" placeholder="z. B. 250" value="' + esc(d.g) + '"></div>' +
      '<div class="fcol"><span class="eyebrow">Die Nährwerte gelten für</span><div class="seg" role="group" aria-label="Bezugsgröße der Nährwerte">' +
      '<button class="chip" type="button" data-act="food-mode" data-mode="100" aria-pressed="' + (d.mode === '100') + '">pro 100 g</button>' +
      '<button class="chip" type="button" data-act="food-mode" data-mode="por" aria-pressed="' + (d.mode === 'por') + '">ganze Menge</button></div></div>' +
      '<div class="grid2">' + NUTR.slice(0, 4).map(function (n) { return fieldHTML(n, d); }).join('') + '</div>' +
      '<button class="link" type="button" data-act="food-more">' + (d.more ? 'Weniger Werte' : 'Mehr Werte (Zucker, Ballaststoffe)') + '</button>';
    if (d.more) h += '<div class="grid2">' + NUTR.slice(4).map(function (n) { return fieldHTML(n, d); }).join('') + '</div>';
    h += '<p class="preview" id="food-preview">' + esc(previewText()) + '</p>' +
      '<button class="btn" type="button" data-act="food-add">Hinzufügen</button>' +
      '<p class="msg" id="food-msg">' + esc(R.foodMsg) + '</p></section>';
    return h;
  }

  function foodEntryHTML(e) {
    var tot = entryTotals(e), chips = '', src;
    NUTR.forEach(function (n) {
      if (tot[n.k] != null) chips += '<span class="nchip"><b>' + fmt(tot[n.k], n.u) + '</b> ' + (n.u === 'kcal' ? 'kcal' : 'g ' + n.l) + '</span>';
    });
    var entered = partsOf(e.v);
    if (!entered.length) src = 'Ohne Nährwerte eingetragen.';
    else if (e.mode === 'por') src = 'Eingegeben für die ganze Menge.';
    else src = 'Eingegeben pro 100 g: ' + entered.join(' · ') + (e.g == null ? '. Menge fehlt, deshalb nicht eingerechnet.' : '.');
    return '<div class="fe"><div class="fe-top"><div class="fe-name"><b>' + (e.name ? esc(e.name) : 'Ohne Namen') + '</b>' + (e.g != null ? '<small>' + fmt(e.g, 'g') + ' g</small>' : '') + '</div>' +
      '<button class="fe-del" type="button" data-act="food-del" data-id="' + esc(e.id) + '" aria-label="Eintrag löschen">' + TRASH + '</button></div>' +
      (chips ? '<div class="nchips">' + chips + '</div>' : '') + '<p class="fe-src">' + src + '</p></div>';
  }

  function foodListHTML(k) {
    var list = S.food[k] || [], h = '';
    if (R.undo) h += '<div class="note">Eintrag gelöscht. <button class="link inline" type="button" data-act="food-undo">Rückgängig</button></div>';
    if (!list.length) return h ? '<section>' + h + '</section>' : '';
    return '<section aria-labelledby="fl-h"><h3 class="eyebrow" id="fl-h">' + (k === todayKey() ? 'Heute gegessen' : 'Gegessen') + ' · ' + list.length + (list.length === 1 ? ' Eintrag' : ' Einträge') + '</h3>' + h + '<div class="list">' + list.map(foodEntryHTML).join('') + '</div></section>';
  }

  /* ---------- footer ---------- */
  function footHTML() {
    var h = '<footer class="foot"><p>' + (storageOK
      ? 'Deine Daten werden in diesem Browser auf diesem Handy gespeichert. Das Training beginnt jeden Tag neu.'
      : 'In diesem Fenster wird nichts gespeichert. Die Daten bleiben nur, solange die Seite offen ist.') + '</p>';
    if (R.tab === 'train') {
      h += R.confirm
        ? '<div class="confirm"><span>Alle Haken von ' + PLAN[S.day].label + ' löschen?</span><div class="two">' +
          '<button class="btn sm" type="button" data-act="reset-yes">Löschen</button>' +
          '<button class="btn ghost sm" type="button" data-act="reset-no">Abbrechen</button></div></div>'
        : '<button class="link" type="button" data-act="reset-ask">' + PLAN[S.day].label + ' zurücksetzen</button>';
    }
    h += '<button class="link" type="button" data-act="bk-toggle">' + (R.bkOpen ? 'Sicherung schließen' : 'Daten sichern oder wiederherstellen') + '</button>';
    if (R.bkOpen) {
      h += '<div class="bk"><p>Kopiere deine Daten und speichere sie zum Beispiel in einer Notiz. Mit Einfügen und Wiederherstellen holst du sie zurück. Das ersetzt die aktuellen Daten.</p>' +
        '<button class="btn ghost sm" type="button" data-act="bk-copy">Daten kopieren</button>' +
        '<textarea id="bk-text" rows="4" placeholder="Gesicherte Daten hier einfügen" aria-label="Gesicherte Daten"></textarea>' +
        '<button class="btn ghost sm" type="button" data-act="bk-restore">Wiederherstellen</button>' +
        '<p class="msg" id="bk-msg">' + esc(R.bkMsg) + '</p></div>';
    }
    return h + '</footer>';
  }

  var app = document.getElementById('app');

  function render() {
    Anim.stop();
    var head, main;
    if (R.tab === 'cal') {
      head = calHeaderHTML(); main = calGridHTML() + calDetailHTML();
    } else if (R.tab === 'food') {
      var k = R.foodDate, T = dayTotals(k);
      head = foodHeaderHTML(); main = summaryHTML(T) + formHTML() + foodListHTML(k);
    } else {
      var d = S.day, t = totals(d), cur = currentEx(d), body;
      if (t.done >= t.total) body = finishHTML(d, t);
      else if (R.rest) body = restHTML(d);
      else body = focusHTML(d, cur, t);
      head = headerHTML(t); main = body + listHTML(d, cur);
    }
    app.innerHTML = '<h1 class="sr">Trainings-Strichliste</h1>' + head + '<main>' + main + '</main>' + footHTML() + navHTML();
    R.fresh = null;
    Anim.mount();
  }

  /* ---------- events ---------- */
  function goTab(tab, key) {
    R.tab = tab; R.plank = null; R.confirm = false; R.undo = null;
    if (tab === 'food' && key && parseKey(key)) R.foodDate = key;
    if (tab === 'cal' && key && parseKey(key)) { var d = parseKey(key); R.calSel = key; R.cal = { y: d.getFullYear(), m: d.getMonth() }; }
    render(); toTop();
  }

  app.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || !app.contains(b)) return;
    unlockAudio(); wake();
    var a = b.getAttribute('data-act'), d = S.day, cur = currentEx(d), n, k;

    if (a === 'tab') { goTab(b.getAttribute('data-tab'), b.getAttribute('data-key')); }
    else if (a === 'day') {
      S.day = b.getAttribute('data-day'); R.rest = null; R.plank = null; R.confirm = false; R.last = null; R.calForm = false;
      save(); render(); toTop();
    } else if (a === 'set' && cur) {
      var i = parseInt(b.getAttribute('data-i'), 10); n = doneSets(d, cur.id);
      setCount(cur, i < n ? i : n + 1);
    } else if (a === 'done' && cur) {
      setCount(cur, doneSets(d, cur.id) + 1);
    } else if (a === 'plank-start' && cur) {
      startPlank(cur);
    } else if (a === 'plank-cancel') {
      R.plank = null; render();
    } else if (a === 'plank-secs') {
      S.plankSecs = parseInt(b.getAttribute('data-secs'), 10) === 60 ? 60 : 45; save(); render();
    } else if (a === 'skip') {
      R.rest = null; render(); toTop();
    } else if (a === 'plus' && R.rest) {
      var now = Date.now();
      R.rest.endAt = Math.max(R.rest.endAt, now) + 30000;
      R.rest.total = Math.max(R.rest.total, Math.ceil((R.rest.endAt - now) / 1000));
      R.rest.finished = false; render();
    } else if (a === 'undo' && R.last) {
      var ex = findEx(d, R.last);
      if (ex) { R.pick[d] = ex.id; setCount(ex, doneSets(d, ex.id) - 1); }
      R.last = null; toTop();
    } else if (a === 'pick') {
      R.pick[d] = b.getAttribute('data-id'); R.rest = null; R.plank = null; render(); toTop();
    } else if (a === 'demo-toggle') {
      R.demoOpen = !R.demoOpen; render();
    } else if (a === 'anim-play') {
      var id = b.getAttribute('data-ex');
      if (Anim.playing) { Anim.stop(); Anim.mount(); } else Anim.play(id);
    } else if (a === 'reset-ask') {
      R.confirm = true; render();
    } else if (a === 'reset-no') {
      R.confirm = false; render();
    } else if (a === 'reset-yes' || a === 'restart') {
      resetDay(d);
    } else if (a === 'cal-open') {
      R.calForm = true; render();
    } else if (a === 'cal-cancel') {
      R.calForm = false; render();
    } else if (a === 'cal-save') {
      calSave();
    } else if (a === 'cal-prev' || a === 'cal-next') {
      var dm = new Date(R.cal.y, R.cal.m + (a === 'cal-next' ? 1 : -1), 1);
      R.cal = { y: dm.getFullYear(), m: dm.getMonth() }; render();
    } else if (a === 'cal-day') {
      R.calSel = b.getAttribute('data-key'); render();
    } else if (a === 'cal-add' || a === 'cal-remove') {
      k = R.calSel; var l = b.getAttribute('data-day'), arr = S.log[k] || [];
      if (a === 'cal-add') { if (arr.indexOf(l) < 0 && k <= todayKey()) arr.push(l); arr.sort(); S.log[k] = arr; }
      else { arr = arr.filter(function (x) { return x !== l; }); if (arr.length) S.log[k] = arr; else delete S.log[k]; }
      save(); render();
    } else if (a === 'food-prev') {
      R.foodDate = addDays(R.foodDate, -1); R.undo = null; R.foodMsg = ''; render();
    } else if (a === 'food-next') {
      if (R.foodDate < todayKey()) { R.foodDate = addDays(R.foodDate, 1); R.undo = null; R.foodMsg = ''; render(); }
    } else if (a === 'food-mode') {
      R.draft.mode = b.getAttribute('data-mode') === 'por' ? 'por' : '100'; render();
    } else if (a === 'food-more') {
      R.draft.more = !R.draft.more; render();
    } else if (a === 'food-add') {
      addFood();
    } else if (a === 'food-recent') {
      var rc = S.recent[parseInt(b.getAttribute('data-i'), 10)];
      if (rc) {
        var nd = newDraft(rc.mode);
        nd.name = rc.name; nd.g = rc.g != null ? numStr(rc.g) : '';
        NUTR.forEach(function (nu) { if (rc.v[nu.k] != null) nd.v[nu.k] = numStr(rc.v[nu.k]); });
        nd.more = !!(rc.v.s != null || rc.v.b != null);
        R.draft = nd; R.foodMsg = ''; render();
      }
    } else if (a === 'food-del') {
      k = R.foodDate; var list = S.food[k] || [], id2 = b.getAttribute('data-id');
      for (n = 0; n < list.length; n++) {
        if (list[n].id === id2) {
          R.undo = { key: k, entry: list[n], idx: n };
          list.splice(n, 1);
          if (!list.length) delete S.food[k];
          break;
        }
      }
      R.foodMsg = ''; save(); render();
    } else if (a === 'food-undo' && R.undo) {
      var u = R.undo, ul = S.food[u.key] || (S.food[u.key] = []);
      ul.splice(Math.min(u.idx, ul.length), 0, u.entry);
      R.undo = null; save(); render();
    } else if (a === 'goal-toggle') {
      R.goalOpen = !R.goalOpen; render();
    } else if (a === 'goal-w16') {
      if (S.weightKg) { S.goalP = Math.round(1.6 * S.weightKg); save(); render(); }
    } else if (a === 'bk-toggle') {
      R.bkOpen = !R.bkOpen; R.bkMsg = ''; render();
    } else if (a === 'bk-copy') {
      var text = exportText(), ta = document.getElementById('bk-text');
      function fallback() {
        if (ta) { ta.value = text; ta.focus(); ta.select(); }
        R.bkMsg = 'Markiere den Text im Feld und kopiere ihn.'; setMsg('bk-msg', R.bkMsg);
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { R.bkMsg = 'Kopiert. Füge den Text jetzt in eine Notiz ein.'; setMsg('bk-msg', R.bkMsg); }, fallback);
        } else fallback();
      } catch (err) { fallback(); }
    } else if (a === 'bk-restore') {
      var ta2 = document.getElementById('bk-text'), ok = false;
      try { ok = ta2 && ta2.value.trim() && applyData(JSON.parse(ta2.value)); } catch (err) { ok = false; }
      if (ok) { refreshDays(); save(); R.bkMsg = 'Wiederhergestellt.'; render(); }
      else { R.bkMsg = 'Das hat nicht geklappt. Füge den kompletten kopierten Text ein.'; setMsg('bk-msg', R.bkMsg); }
    }
  });

  app.addEventListener('input', function (e) {
    var t = e.target;
    if (!t || !t.getAttribute) return;
    var w = t.getAttribute('data-weight'), dn = t.getAttribute('data-draft'), dv = t.getAttribute('data-draft-v'), gl = t.getAttribute('data-goal');
    if (w) { S.weights[w] = t.value; save(); }
    else if (dn) { R.draft[dn] = t.value; setMsg('food-preview', previewText()); }
    else if (dv) { R.draft.v[dv] = t.value; setMsg('food-preview', previewText()); }
    else if (gl === 'p') { S.goalP = posNum(num(t.value)); save(); }
    else if (gl === 'w') {
      S.weightKg = posNum(num(t.value)); save();
      var hEl = document.getElementById('goal-hint'), bEl = document.getElementById('goal-btn');
      if (hEl) hEl.textContent = goalHintText();
      if (bEl) bEl.innerHTML = goalBtnHTML();
    }
  });

  /* The totals and the header bar pick up a new goal when the field is left for nothing in particular.
     Moving to another field or a button must not re-render, or the keyboard closes and the tap is lost. */
  app.addEventListener('focusout', function (e) {
    var t = e.target;
    if (t && t.getAttribute && t.getAttribute('data-goal') && !e.relatedTarget) render();
  });

  app.addEventListener('keydown', function (e) {
    var t = e.target;
    if (e.key === 'Enter' && t && t.getAttribute && (t.getAttribute('data-draft') || t.getAttribute('data-draft-v'))) { e.preventDefault(); addFood(); }
  });

  /* ---------- timers ---------- */
  setInterval(function () {
    var now = Date.now(), el;
    if (R.plank) {
      var p = R.plank;
      if (now >= p.endAt) {
        var ex = p.ex; R.plank = null; beep(2); buzz([200, 100, 200]);
        setCount(ex, doneSets(S.day, ex.id) + 1);
        return;
      }
      var ps = plankState();
      if (ps.phase !== p.phase) { p.phase = ps.phase; beep(1); buzz(120); render(); }
      else {
        el = document.getElementById('plank-time'); if (el) el.textContent = ps.left;
        el = document.getElementById('plank-ring'); if (el) el.style.strokeDashoffset = Math.round(553 * (1 - ps.frac));
      }
    }
    if (R.rest) {
      var r = R.rest, left = Math.max(0, Math.ceil((r.endAt - now) / 1000));
      el = document.getElementById('rest-clock'); if (el) el.textContent = clock(left);
      el = document.getElementById('rest-bar'); if (el) el.style.width = Math.max(0, Math.min(100, left / r.total * 100)) + '%';
      if (left === 0 && !r.finished) {
        r.finished = true; beep(1); buzz([150, 80, 150]);
        if (R.tab === 'train' && !Anim.playing) render();
      }
    }
  }, 250);

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { wake(); refreshDays(); save(); if (!Anim.playing) render(); }
  });

  refreshDays();
  render();
})();
</script>
